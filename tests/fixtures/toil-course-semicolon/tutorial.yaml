bundle_format: 1
id: toil-course-semicolon
title: A Semicolon-Lead Regression Fixture
description: >
  A minimal bundle reproducing, verbatim, two real sentences the fix-round-2
  review found: a five-file copy instruction whose verb sits after a
  semicolon rather than a full stop, a comma or a bullet
  (webgl-typescript-scene's regenerated catalogue,
  lessons/01-canvas-and-context/LESSON.md:42), and a noun "copy" that a
  hard-wrap puts at a physical line's start
  (durable-event-broker/lessons/14-asynchronous-follower.md:30).

lessons:
  - lessons/00-bootstrap.md

workspace_kind: none
tutor_owned: [tutorial/STATE.md, tutorial/DESIGN.md]
learner_owned: []
ownership_policy: tutor-must-not-edit-learner-owned

validators:
  manual: { kind: manual }

one_task_at_a_time: true
solution_code: on-request-only
advance_on: validated-evidence-only
